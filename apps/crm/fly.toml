# Fly.io deployment for the CRM: crm.odg.co.il.
#
# Build context is the REPOSITORY ROOT of a fresh clone, and the image recipe is
# shared by the three Next.js apps:
#
#   flyctl deploy --config apps/crm/fly.toml --dockerfile apps/Dockerfile.next .
#
# The GitHub workflow "Deploy to Fly" runs exactly that. See docs/DEPLOYMENT.md.

app = "odg-crm"
primary_region = "cdg"   # Paris, beside the API

[build]
  dockerfile = "../Dockerfile.next"

  # Compiled into the pages by `next build`. Changing one needs a new deploy.
  [build.args]
    APP = "crm"
    NEXT_PUBLIC_API_URL = "https://api.odg.co.il"
    NEXT_PUBLIC_WEBSITE_URL = "https://odg.co.il"

[env]
  # Where the CRM's own server forwards API calls (the BFF proxy and sign-in).
  API_GATEWAY_URL = "https://api.odg.co.il"

[http_service]
  internal_port = 3000
  force_https = true
  # Staff use the CRM in working hours. Idle, the machine stops and costs
  # nothing; the next request starts it again within a few seconds.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/he/login"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
