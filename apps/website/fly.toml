# Fly.io deployment for the public website: odg.co.il and www.odg.co.il.
#
# Build context is the REPOSITORY ROOT of a fresh clone, and the image recipe is
# shared by the three Next.js apps:
#
#   flyctl deploy --config apps/website/fly.toml --dockerfile apps/Dockerfile.next .
#
# The GitHub workflow "Deploy to Fly" runs exactly that. See docs/DEPLOYMENT.md.

app = "odg-website"
primary_region = "cdg"   # Paris, beside the API

[build]
  dockerfile = "../Dockerfile.next"

  # Compiled into the pages by `next build`. Changing one needs a new deploy.
  [build.args]
    APP = "website"
    NEXT_PUBLIC_API_URL = "https://api.odg.co.il"
    NEXT_PUBLIC_SITE_URL = "https://odg.co.il"
    NEXT_PUBLIC_PORTAL_URL = "https://portal.odg.co.il"
    # The build reads the CMS to prerender the pages. Must equal the bootstrap
    # tenant's slug (docs/DEPLOYMENT.md, step 4).
    CMS_TENANT_SLUG = "opendoor"

[env]
  CMS_TENANT_SLUG = "opendoor"

[http_service]
  internal_port = 3000
  force_https = true
  # One machine always runs: the first visitor and every search engine get an
  # answer without waiting for a cold start.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/he"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# ── Secrets ───────────────────────────────────────────────────────────────────
# NOT set here. `flyctl secrets set --config apps/website/fly.toml ...`:
#   CMS_REVALIDATE_SECRET   the same value as on the API
#   ANTHROPIC_API_KEY       the question box on the site
