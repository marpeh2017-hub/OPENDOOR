# Fly.io deployment for the API gateway.
#
# Build context is the REPOSITORY ROOT, not this directory: the Dockerfile
# copies pnpm-workspace.yaml, the lockfile and packages/db, none of which are
# reachable from services/api-gateway. Deploy with:
#
#   flyctl deploy --config services/api-gateway/fly.toml --dockerfile services/api-gateway/Dockerfile .
#
# run from the root of a FRESH CLONE of the pushed branch, with the trailing
# dot. Never from a working folder: the image copies packages/db whole, and an
# untracked draft migration there would be applied to the live database on
# boot (see docs/DEPLOYMENT.md).

app = "odg-api"
primary_region = "cdg"   # Paris — closest Fly region to Israel with full service

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  # The four public origins, required in production (CORS, links in messages).
  # WEB_URL belongs to the retired apps/web and carries the CRM's address.
  WEBSITE_URL = "https://odg.co.il"
  CRM_URL = "https://crm.odg.co.il"
  PORTAL_URL = "https://portal.odg.co.il"
  WEB_URL = "https://crm.odg.co.il"
  # The tenant that owns website enquiries: the bootstrap slug, the same value
  # as CMS_TENANT_SLUG in apps/website/fly.toml.
  PUBLIC_LEAD_TENANT_SLUG = "opendoor"
  # Required in production, and "false" really sends. The gateway also refuses
  # to start without an SMS provider's credentials (docs/DEPLOYMENT.md).
  MESSAGING_SIMULATE = "false"
  # Fly terminates TLS at its edge and forwards over the private network, so the
  # client IP arrives in X-Forwarded-For with exactly one proxy hop in front.
  # Rate limiting keys on that header, and an unset TRUST_PROXY would bucket
  # every request in the world under Fly's own address.
  TRUST_PROXY = "1"

[http_service]
  internal_port = 4000
  # Fly issues and renews the certificate, and redirects http -> https at the
  # edge. This line is what actually delivers the TLS that the HSTS headers
  # already shipped in the apps have been asserting.
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # The gateway holds a Prisma pool and a Redis connection, and start.sh runs
  # `prisma migrate deploy` on boot. Scaling to zero would re-run migrations on
  # every cold start and make the first request after idle pay for a full boot.
  min_machines_running = 1

  [[http_service.checks]]
    # /api/v1/health is @Public() and verifies Postgres and Redis, returning 503
    # when either is down — so a machine that cannot reach its database is taken
    # out of rotation rather than serving errors.
    #
    # Two controllers sit under `health`, and they do NOT collide: the @Public()
    # one in src/health.controller.ts owns the bare path with @Get(), while the
    # tenant health-score one in src/health/health.controller.ts only defines
    # @Get('portfolio') and @Get(':projectId'). Verified against a running
    # server: /api/v1/health returns the health JSON, /api/v1/health/portfolio
    # returns 401.
    #
    # The one thing to keep in mind is that `@Get(':projectId')` will swallow
    # any new single-segment route added under health, so a future /health/live
    # would resolve to a project lookup and return 401 here.
    path = "/api/v1/health"
    method = "GET"
    interval = "15s"
    timeout = "4s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"   # Prisma plus the PDF renderer; 512mb OOMs during export

# ── Secrets ───────────────────────────────────────────────────────────────────
# NOT set here. Anything in [env] is committed to git and visible in the app's
# metadata. Every value in the SECRETS list of docs/DEPLOYMENT.md goes through
# `flyctl secrets set`, which stores it encrypted and restarts the app.
